# eastbaybiosecurity.org is retired; everything redirects to the archive on tessa.fyi.
[build]
  publish = "public"
  command = "echo redirect-only site, nothing to build"

[[redirects]]
  from = "/blog/defcon-biohacking-genetic-privacy/*"
  to = "https://tessa.fyi/projects/east-bay-biosecurity/blog/defcon-biohacking-genetic-privacy"
  status = 301
  force = true

[[redirects]]
  from = "/blog/2018/8/6/*"
  to = "https://tessa.fyi/projects/east-bay-biosecurity/blog/summer-workshop-report"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://tessa.fyi/projects/east-bay-biosecurity/2018-2019#writing"
  status = 301
  force = true

[[redirects]]
  from = "/events/*"
  to = "https://tessa.fyi/projects/east-bay-biosecurity/2018-2019#events"
  status = 301
  force = true

[[redirects]]
  from = "/short-talks/*"
  to = "https://tessa.fyi/projects/east-bay-biosecurity/2018-2019#events"
  status = 301
  force = true

[[redirects]]
  from = "/team/*"
  to = "https://tessa.fyi/projects/east-bay-biosecurity/team"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://tessa.fyi/projects/east-bay-biosecurity/"
  status = 301
  force = true
